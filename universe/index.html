<!DOCTYPE html>

<link rel="stylesheet" href="../styles.css">
<style>
  :root { --fg:#cfe3ff; --dim:#7f93b4; --panel:rgba(10,16,30,.86); }

              font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; overflow:hidden; }
  #app { position:fixed; inset:112px 20px 190px; overflow:hidden;
         border:1px solid #00f0ff; border-radius:8px;
         box-shadow:0 0 8px rgba(0,240,255,.4),
                    inset 0 0 18px rgba(0,240,255,.08);

  #hud { position:fixed; top:124px; left:32px; z-index:10; max-width:340px;

         padding:12px 14px; backdrop-filter:blur(4px); }
  #hud h1 { margin:0 0 4px; font-size:15px; letter-spacing:.5px; color:#fff; }
  #hud .sub { color:var(--dim); font-size:11px; margin-bottom:8px; }

  button { background:#12224a; color:var(--fg); border:1px solid #2b477f;
           border-radius:8px; padding:8px 14px;
           cursor:pointer; font:inherit; }

  #search { background:#0c1631; color:var(--fg); border:1px solid #2b477f;
            border-radius:8px; padding:8px 10px; font:inherit; width:170px; }

  #panel { position:fixed; right:32px; bottom:202px; z-index:10; width:320px;
           max-height:52vh; overflow:auto; background:var(--panel);
           border:1px solid #1d2c4d; border-radius:10px; padding:12px 14px;
           display:none; }
  #panel h2 { margin:0 0 2px; font-size:14px; color:#fff; }
  #panel .q { color:var(--dim); margin-bottom:8px; }
  #panel .desc { color:#b9cdee; margin-bottom:10px; }
  #panel .nav { padding:6px 8px; margin:4px 0; border-radius:6px;
                background:#0d1730; border-left:3px solid #39507f; }

  #legend { position:fixed; left:32px; bottom:202px; z-index:10;
            background:var(--panel); border:1px solid #1d2c4d; border-radius:10px;
            padding:10px 12px; font-size:11px; }
  #legend .row { display:flex; align-items:center; gap:6px; margin:2px 0; }
  #legend .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }

  #tip { position:fixed; z-index:11; pointer-events:none; background:#0c1631ee;
         border:1px solid #2b477f; border-radius:6px; padding:4px 8px;

  #loading { position:fixed; inset:0; display:flex; align-items:center;
             justify-content:center; color:var(--dim); z-index:20; }
  @media (max-width:600px) {
    #app { inset:92px 10px 250px; }
  }

  /* Keep the shared site chrome visible around the full-screen map. */
  .page-header-injected {
    position: fixed;
    z-index: 30;
    top: 0;
    left: 0;
    right: 0;
    padding: 16px 20px 12px;
    background: rgba(11, 13, 23, 0.94);
    border-bottom: 1px solid var(--accent-color);
  }
  .page-header-injected h1 { font-size: 1.5rem; margin: 0; }
  .page-header-injected .breadcrumb { margin-bottom: 4px; }
  .legal-disclaimer {
    position: fixed;
    z-index: 30;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 180px;
    overflow: auto;
    margin-top: 0;
    padding: 12px 20px;
    background: rgba(15, 15, 30, 0.94);
  }
  .legal-disclaimer p { margin-bottom: 6px; }
  .fair-use-notice, .dmca-notice { margin-top: 8px; padding-top: 8px; }
</style>
<script src="../header.js"></script>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>WC Universe</h1>
  <div class="sub">Jump-node graph &middot; <span id="count"></span></div>
  <div>Mode: <span class="mode" id="modeLabel">Universe</span></div>
  <div class="sub" id="help">Top-down map &middot; drag to orbit &middot; scroll to zoom &middot; double-click a system to enter &middot; double-click a jump point to travel &middot; ◉ toggles faction influence</div>
</div>

<div id="controls">
  <input id="search" placeholder="jump to system…" list="systemList" />
  <datalist id="systemList"></datalist>
  <button id="influenceBtn">◉ Influence</button>
  <button id="universeBtn" disabled>◀ Universe</button>
</div>

<div id="legend"></div>
<div id="panel"></div>
<div id="tip"></div>
<div id="loading">loading universe…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

const SPRITE_ASSETS = {
  agricultural: 'Privateer_-_Sprite_Sheet_-_Space_-_Agricultural_Planet.png',
  pleasure: '120px-PRIV_-_Pleasure_Planet.png',
  solar: 'solar.webp',
  refinery: '120px-Privateer_-_Bases_-_Refinery.png',
  asteroidBase: '120px-Privateer_-_Sprite_Sheet_-_Space_-_Asteroid_Base.png',
  amonium: 'amonium-world.webp',
  water: 'water-world.webp'
};
const SPRITE_ASPECTS = {
  agricultural: 183/171,
  pleasure: 120/112,
  solar: 1,
  refinery: 120/73,
  asteroidBase: 120/106,
  amonium: 597/551,
  water: 501/512
};
const spriteTextures = Object.fromEntries(
  Object.entries(SPRITE_ASSETS).map(([key, file]) =>
    // Resolve sprites relative to this page, including when the site is
    // hosted below a non-root path.
    [key, new THREE.TextureLoader().load(new URL(file, import.meta.url).href)])
);

const FACTION_COLORS = {
  confed:0x5fb0ff, kilrathi:0xff5a5a, kilrah:0xff5a5a, pirates:0xff9f3b,
  retro:0xffe14d, retros:0xffe14d, nephilim:0x9b6bff, militia:0x7CFF9F,
  merchant:0x6bd9ff, hunter:0xffb86b, border:0xb0b0b0, neutral:0xb0b0b0,
  unknown:0x8899bb
};
const factionColor = f => FACTION_COLORS[(f||'unknown').toLowerCase()] ?? 0x8899bb;

const app = document.getElementById('app');
const tip = document.getElementById('tip');
const panel = document.getElementById('panel');
const modeLabel = document.getElementById('modeLabel');
const universeBtn = document.getElementById('universeBtn');

let scene, camera, renderer, controls, raycaster, pointer;
let systemsData, jumpsData, navData, sectorsData;
let systemById = new Map();
let pointCloud, edgeLines, labelSprites = [];
let systemPositions = [];   // THREE.Vector3 indexed same as systemsData
let mode = 'universe';
let systemView = null;       // group for the entered-system scene
let hovered = -1;
let universeTopHeight = 8000; // camera height for top-down view
let influenceGroup = null;    // faction spheres-of-influence (metaballs)
let influenceByFaction = new Map(); // faction key -> MarchingCubes mesh
let jumpMeshes = [];          // jump-point meshes in the current system view
let systemLabelGroup = null;  // lazily-created system labels in universe view
let systemLabels = [];        // {sprite, pos} for distance-based visibility

// camera animation
let camAnim = null;

init().catch(err => {
  console.error(err);
  const el = document.getElementById('loading');
  if (el) {
    el.style.flexDirection = 'column';
    el.style.color = '#ff8080';
    el.style.padding = '20px';
    el.style.textAlign = 'center';
    el.innerHTML = '<div><b>Failed to load.</b></div>' +
      '<div style="max-width:70ch;margin-top:8px;color:#ffb0b0;font-size:12px;white-space:pre-wrap">' +
      String(err && err.stack ? err.stack : err).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) +
      '</div>';
  }
});

async function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070f);
  scene.fog = new THREE.FogExp2(0x05070f, 0.00018);

  camera = new THREE.PerspectiveCamera(55, app.clientWidth/app.clientHeight, 1, 120000);
  camera.position.set(0, 9000, 0.0001);   // top-down

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(app.clientWidth, app.clientHeight);
  app.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enableZoom = true;
  controls.enableRotate = true;
  controls.enablePan = true;
  // The universe camera is thousands of units from the origin, so the
  // OrbitControls default exponential dolly feels much too abrupt.
  controls.zoomSpeed = 0.2;
  controls.minDistance = 100;
  controls.maxDistance = 20000;

  raycaster = new THREE.Raycaster();
  raycaster.params.Points.threshold = 60;
  pointer = new THREE.Vector2();

  addStarfield();

  const data = await (await fetch('wcuniverse.json')).json();
  sectorsData = data.sectors;
  // The JSON is hierarchical; flatten systems only for the renderer's
  // universe-wide point cloud, labels, search, and jump routing.
  systemsData = sectorsData.flatMap(sector =>
    (sector.systems || []).map(system => ({ ...system, sector: system.sector || sector.name }))
  );
  jumpsData   = data.jumps;
  // Normalize the two nav-point sources before rendering.  The WC data uses
  // dest_sector/dest_system, while imported CombatBot navs use a lowercase
  // destination slug.  Keep one renderer-facing shape so both sources behave
  // identically in the system view.
  navData     = new Map(systemsData.map(system => [String(system.id),
    normalizeNavPoints(system, system.nav_points || [])]));
  systemsData.forEach(s => systemById.set(s.id, s));

  document.getElementById('count').textContent =
    `${systemsData.length} systems · ${jumpsData.length} jumps`;
  buildLegend();
  buildSystemList();
  buildUniverse();
  frameUniverse(false);

  document.getElementById('loading').remove();

  addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('dblclick', onDblClick);
  universeBtn.addEventListener('click', exitToUniverse);
  document.getElementById('search').addEventListener('change', onSearch);
  document.getElementById('influenceBtn').addEventListener('click', (e)=>{
    if(!influenceGroup) return;
    influenceGroup.visible = !influenceGroup.visible;
    e.target.style.opacity = influenceGroup.visible ? '1' : '0.45';
  });

  animate();
}

function systemSlug(name){
  return String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function normalizeNavPoints(system, rawNavs){
  const authoredBases = rawNavs.filter(n => n.source === 'combatbot' && n.kind === 'base');
  return rawNavs
    // If the imported sector data has authored bases, its generic WC base
    // placeholders are duplicates (e.g. Troy s / Troy s #2).
    .filter(n => !(authoredBases.length && n.source !== 'combatbot' && n.kind === 'base'))
    .map(n => {
      const v = { ...n };
      const destination = v.destination || v.jump_destination;
      if (destination && !v.dest_system) {
        const target = systemsData.find(s => systemSlug(s.name) === systemSlug(destination));
        if (target) {
          v.dest_sector = target.sector;
          v.dest_system = target.name;
        } else {
          // Preserve an unresolved destination for the panel, but do not make
          // it look like a valid clickable route.
          v.dest_sector = v.dest_sector || system.sector;
          v.dest_system = destination;
        }
      }
      // A destination is authoritative: even if an imported record was
      // labelled nav_point, it is a jump node and must be rendered/clickable.
      if (v.dest_system) v.kind = 'jump_point';
      return v;
    });
}

// ---- coordinate mapping: center the cloud around origin ----
let center = new THREE.Vector3();
function computeCenter() {
  const b = new THREE.Box3();
  systemsData.forEach(s => b.expandByPoint(new THREE.Vector3(s.x, s.z, s.y)));
  b.getCenter(center);
}
// note: we map DB (x,y,z) -> world (x, z, y) so the thin Z axis becomes "up"
function worldPos(s){ return new THREE.Vector3(s.x - center.x, s.z - center.y, s.y - center.z); }

function buildUniverse() {
  computeCenter();
  systemPositions = systemsData.map(worldPos);

  // horizontal extent (world X/Z plane) to fit a top-down view
  let maxX=0, maxZ=0;
  systemPositions.forEach(p=>{ maxX=Math.max(maxX,Math.abs(p.x)); maxZ=Math.max(maxZ,Math.abs(p.z)); });
  const half=Math.max(maxX, maxZ)*1.08;
  const vFov=THREE.MathUtils.degToRad(camera.fov);
  const hByV = half/Math.tan(vFov/2);                     // fit vertical
  const hByH = half/(Math.tan(vFov/2)*camera.aspect);     // fit horizontal
  universeTopHeight = Math.max(hByV, hByH);

  // points
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(systemsData.length*3);
  const col = new Float32Array(systemsData.length*3);
  const siz = new Float32Array(systemsData.length);
  const c = new THREE.Color();
  systemsData.forEach((s,i) => {
    const p = systemPositions[i];
    pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
    c.setHex(factionColor(s.faction));
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i] = 9.5 + Math.min(s.hazard_count||0, 8)*1.5;
  });
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('vcolor', new THREE.BufferAttribute(col,3));
  geo.setAttribute('asize', new THREE.BufferAttribute(siz,1));

  const mat = new THREE.ShaderMaterial({
    uniforms:{},
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute float asize; attribute vec3 vcolor; varying vec3 vC;
      void main(){ vC=vcolor; vec4 mv=modelViewMatrix*vec4(position,1.0);
        float s = asize * (6000.0 / -mv.z);
        gl_PointSize = clamp(s, 2.5, 17.5);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`
      varying vec3 vC;
      void main(){ vec2 d=gl_PointCoord-vec2(0.5); float r=length(d);
        if(r>0.5) discard;
        // wide glowing halo + large sharp bright core
        float halo = pow(smoothstep(0.5, 0.0, r), 1.3);
        float core = smoothstep(0.34, 0.0, r);
        vec3 col = vC * (3.0 + core*3.0);            // strongly boosted color
        col = mix(col, vec3(1.0), core*0.95);        // white-hot center
        float a = clamp(halo*1.1 + core*1.0, 0.0, 1.0);
        gl_FragColor = vec4(col, a); }`
  });
  pointCloud = new THREE.Points(geo, mat);
  scene.add(pointCloud);

  // jump edges
  const idxById = new Map();
  systemsData.forEach((s,i)=>idxById.set(s.id,i));
  const epos = [];
  jumpsData.forEach(([a,b]) => {
    const ia = idxById.get(a);
    const ib = idxById.get(b);
    if(ia===undefined||ib===undefined) return;
    const pa=systemPositions[ia], pb=systemPositions[ib];
    epos.push(pa.x,pa.y,pa.z, pb.x,pb.y,pb.z);
  });
  const egeo = new THREE.BufferGeometry();
  egeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(epos),3));
  edgeLines = new THREE.LineSegments(egeo,
    new THREE.LineBasicMaterial({ color:0xffd21e, transparent:true, opacity:0.42 }));
  scene.add(edgeLines);

  buildSystemLabels();
  buildInfluenceClouds();
}

// ---------- universe-view system labels (shown when zoomed in) ----------
function buildSystemLabels(){
  if(systemLabelGroup){ scene.remove(systemLabelGroup); disposeGroup(systemLabelGroup); }
  systemLabelGroup = new THREE.Group();
  systemLabels = [];
  scene.add(systemLabelGroup);
  systemsData.forEach((s,i)=>{
    const p = systemPositions[i];
    const spr = makeLabel(s.name, '#eaf2ff');
    spr.scale.multiplyScalar(0.6);
    spr.position.set(p.x, p.y + 60, p.z);
    spr.visible = false;
    systemLabelGroup.add(spr);
    systemLabels.push({ sprite: spr, pos: p });
  });
}

// Show a system's label only when the camera is near enough (avoids clutter
// when zoomed out over the whole galaxy).
function updateSystemLabels(){
  if(mode!=='universe' || !systemLabelGroup){ return; }
  const camPos = camera.position;
  // threshold scales so labels appear once you've zoomed "a bit" from the
  // default top-down height.
  const threshold = universeTopHeight * 0.62;
  const t2 = threshold*threshold;
  for(const L of systemLabels){
    L.sprite.visible = camPos.distanceToSquared(L.pos) < t2;
  }
}

// ---------- faction spheres of influence (metaballs) ----------
function buildInfluenceClouds(){
  try {
    if(influenceGroup){ scene.remove(influenceGroup); disposeGroup(influenceGroup); }
    influenceGroup = new THREE.Group();
    influenceByFaction = new Map();
    scene.add(influenceGroup);

    // Shared bounding box of all systems (MarchingCubes works in a unit cube
    // centred on the object, so we scale the field to cover the galaxy).
    const box = new THREE.Box3();
    systemPositions.forEach(p=>box.expandByPoint(p));
    const size = new THREE.Vector3(); box.getSize(size);
    const ctr  = new THREE.Vector3(); box.getCenter(ctr);
    const pad = 1.15;
    const scaleVec = new THREE.Vector3(size.x*pad/2, size.y*pad/2, size.z*pad/2);

    // group systems by faction
    const byFaction = new Map();
    systemsData.forEach((s,i)=>{
      const f=(s.faction||'unknown').toLowerCase();
      if(!byFaction.has(f)) byFaction.set(f,[]);
      byFaction.get(f).push(systemPositions[i]);
    });

    const resolution = 48;          // metaball field resolution
    // Keep each influence local to its system.  The field spans the whole
    // galaxy, so the old value made neighboring systems' metaballs merge into
    // long, stretched regions.
    const strength = 0.08;          // per-ball strength
    const subtract = 12;            // field falloff

    byFaction.forEach((pts, faction)=>{
      if(pts.length < 3) return;     // skip trivial factions
      const colorHex = factionColor(faction);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex, transparent:true, opacity:0.12,
        depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending
      });
      const mc = new MarchingCubes(resolution, mat, true, false, 60000);
      mc.isolation = 50;
      mc.position.copy(ctr);
      mc.scale.copy(scaleVec);
      mc.reset();

      // add a metaball at each system (normalised into the unit cube)
      pts.forEach(p=>{
        const nx = (p.x-ctr.x)/scaleVec.x*0.5 + 0.5;
        const ny = (p.y-ctr.y)/scaleVec.y*0.5 + 0.5;
        const nz = (p.z-ctr.z)/scaleVec.z*0.5 + 0.5;
        if(nx<0||nx>1||ny<0||ny>1||nz<0||nz>1) return;
        mc.addBall(nx, ny, nz, strength, subtract);
      });
      mc.update();
      mc.userData.faction = faction;
      influenceGroup.add(mc);
      influenceByFaction.set(faction, mc);
    });
    buildLegend();  // rebuild now that we know which factions have clouds
  } catch (err) {
    console.warn('Influence clouds disabled:', err);
    influenceGroup = influenceGroup || new THREE.Group();
  }
}

function addStarfield(){
  const n=1800, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=25000+Math.random()*20000;
    const t=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    p[i*3]=r*Math.sin(ph)*Math.cos(t); p[i*3+1]=r*Math.cos(ph); p[i*3+2]=r*Math.sin(ph)*Math.sin(t); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x334066,size:40})));
}

// ---------- labels ----------
function makeLabel(text, color){
  const pad=8, fs=48;
  const cv=document.createElement('canvas'); const ctx=cv.getContext('2d');
  ctx.font=`${fs}px ui-monospace,monospace`;
  cv.width=ctx.measureText(text).width+pad*2; cv.height=fs+pad*2;
  ctx.font=`${fs}px ui-monospace,monospace`;
  ctx.fillStyle='rgba(6,10,20,0.72)'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle=color; ctx.textBaseline='middle'; ctx.fillText(text,pad,cv.height/2);
  const tex=new THREE.CanvasTexture(cv); tex.minFilter=THREE.LinearFilter;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  spr.scale.set(cv.width*0.9, cv.height*0.9, 1);
  return spr;
}

// ---------- interaction ----------
function onResize(){ camera.aspect=app.clientWidth/app.clientHeight; camera.updateProjectionMatrix();
  renderer.setSize(app.clientWidth,app.clientHeight); }

function setPointer(e){ const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }

function pickSystem(){
  raycaster.setFromCamera(pointer,camera);
  const hits=raycaster.intersectObject(pointCloud);
  return hits.length? hits[0].index : -1;
}

function onPointerMove(e){
  setPointer(e);
  if(mode==='system'){
    renderer.domElement.style.cursor='default';
    if(jumpMeshes.length){
      raycaster.setFromCamera(pointer,camera);
      const hits=raycaster.intersectObjects(jumpMeshes, false);
      if(hits.length){
        const j=hits[0].object.userData;
        renderer.domElement.style.cursor='pointer';
        tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
        tip.innerHTML=`⇄ Jump to <b>${j.dest_system}</b> (${j.dest_sector})<br><span style="color:#9fb6dd">double-click to travel</span>`;
        return;
      }
    }
    tip.style.display='none';
    return;
  }
  const i=pickSystem();
  hovered=i;
  if(i>=0){ const s=systemsData[i];
    tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
    tip.innerHTML=`<b>${s.name}</b> — ${s.sector} / ${s.quadrant||'?'}<br>${s.faction||'unknown'} · ${s.hazard_count} hazard(s)`;
  } else tip.style.display='none';
}

function onDblClick(e){
  setPointer(e);
  if(mode==='universe'){
    const i=pickSystem();
    if(i>=0) enterSystem(systemsData[i]);
    return;
  }
  // system view: double-click a jump point to travel to its destination
  if(mode==='system' && jumpMeshes.length){
    raycaster.setFromCamera(pointer,camera);
    const hits=raycaster.intersectObjects(jumpMeshes, false);
    if(hits.length){
      const j=hits[0].object.userData;
      travelToJump(j);
    }
  }
}

function travelToJump(j){
  const dsec=j.dest_sector, dsys=j.dest_system;
  // find the destination system (match by sector + name, fall back to name)
  let dest=systemsData.find(s=>s.sector===dsec && s.name===dsys);
  if(!dest) dest=systemsData.find(s=>s.name===dsys);
  if(dest){ enterSystem(dest); }
  else {
    tip.style.display='block';
    tip.innerHTML=`Destination <b>${dsec}/${dsys}</b> is outside the mapped data.`;
    tip.style.left='50%'; tip.style.top='60px'; tip.style.transform='translateX(-50%)';
    setTimeout(()=>{ tip.style.display='none'; tip.style.transform=''; }, 2200);
  }
}

function onSearch(e){
  const name=e.target.value.trim().toLowerCase();
  const s=systemsData.find(s=>s.name.toLowerCase()===name);
  if(s) enterSystem(s);
  e.target.value='';
}

// ---------- universe camera framing ----------
function frameUniverse(animated=true){
  const target=new THREE.Vector3(0,0,0);
  // Top-down: look straight down the world +Y axis (DB z / "up").
  // Height chosen to fit the full X/Z extent of the galaxy in view.
  const camPos=new THREE.Vector3(0, universeTopHeight, 0.0001);
  if(animated) flyTo(camPos,target); else { camera.position.copy(camPos); controls.target.copy(target); }
}

// ---------- enter / exit system ----------
function enterSystem(s){
  mode='system';
  modeLabel.textContent=`System · ${s.name}`;
  universeBtn.disabled=false;
  tip.style.display='none';

  // dim the universe
  pointCloud.visible=false; edgeLines.visible=false;
  if(influenceGroup) influenceGroup.visible=false;
  if(systemLabelGroup) systemLabelGroup.visible=false;

  if(systemView){ scene.remove(systemView); disposeGroup(systemView); }
  systemView=new THREE.Group(); scene.add(systemView);
  jumpMeshes = [];

  const navs=navData.get(String(s.id))||[];
  const hasAuthoredLayout=navs.some(n=>n.source==='combatbot');
  // Keep generated celestial/nav data when a CombatBot layout is partial.
  // Authored bases and coordinates are overlaid below; filtering the whole
  // system to CombatBot records hides stars, planets, and un-authored jumps.
  const displayNavs=navs;
  const star=displayNavs.find(n=>n.kind==='star');
  const hasAuthoredStar=navs.some(n=>n.source==='combatbot' && n.kind==='star');
  const planets=displayNavs.filter(n=>n.kind==='planet'||n.kind==='base');
  // Authored CombatBot jump points are rendered below at their nav-point
  // coordinates. Do not also create generated outer-ring copies when a
  // system has authored jump coordinates.
  const hasAuthoredJumps=navs.some(n=>n.source==='combatbot' && n.kind==='jump_point');
  const jumps=hasAuthoredJumps
    ? []
    : displayNavs.filter(n=>n.kind==='jump_point');

  // place the system near origin so we can fly to it
  const origin=new THREE.Vector3(0,0,0);

  // star at center
  if(!hasAuthoredStar){
    const starMesh=new THREE.Mesh(
      new THREE.SphereGeometry(60,32,32),
      new THREE.MeshBasicMaterial({color:0xffd36b}));
    starMesh.position.copy(origin); systemView.add(starMesh);
    const glow=new THREE.PointLight(0xffd36b,1,0); starMesh.add(glow);
    systemView.add(labelAt(star?star.name:`${s.name} Star`, origin.clone().add(new THREE.Vector3(0,90,0)), '#ffd36b'));
  }

  // planets on rings
  const ringR=260;
  planets.forEach((p,idx)=>{
    const ang=(idx/Math.max(planets.length,1))*Math.PI*2;
    const rr=ringR+ (idx%3)*120;
    const pos=new THREE.Vector3(Math.cos(ang)*rr, (idx%2?40:-40), Math.sin(ang)*rr);
    const isBase=p.kind==='base';
    const textureKey = spriteKeyForNav(p);
    const m = textureKey
      ? spriteAt(textureKey, 74)
      : new THREE.Mesh(
          isBase ? new THREE.BoxGeometry(34,34,34) : new THREE.SphereGeometry(28,24,24),
          new THREE.MeshStandardMaterial({
            color:isBase?0x7CFF9F:0x5fb0ff,
            roughness:.7,
            emissive:isBase?0x7CFF9F:0x5fb0ff,
            emissiveIntensity:.15
          }));
    m.position.copy(pos); m.userData=p; systemView.add(m);
    // orbit ring
    if(!hasAuthoredLayout) systemView.add(orbitRing(rr));
    const navName = p.base_name || p.name;
    const planetLabel = (isBase ? 'Base: ' : '') + (navName || p.planet_type || 'Nav Point');
    systemView.add(labelAt(planetLabel, pos.clone().add(new THREE.Vector3(0,46,0)),
       isBase?'#7CFF9F':'#9fd0ff'));
    if(p.hazards && p.hazards.length) systemView.add(hazardSprite(pos));
  });

  // jump points around outer ring
  const jr=ringR+ (Math.max(planets.length,1)%3)*120 + 260;
  jumps.forEach((j,idx)=>{
    const ang=(idx/Math.max(jumps.length,1))*Math.PI*2 + 0.3;
    const pos=new THREE.Vector3(Math.cos(ang)*jr, 0, Math.sin(ang)*jr);
    const m=new THREE.Mesh(new THREE.SphereGeometry(30,24,16),
      new THREE.MeshBasicMaterial({color:0x208cff, transparent:true, opacity:0.5}));
    m.position.copy(pos); m.userData=j; m.userData.isJump=true; systemView.add(m);
    jumpMeshes.push(m);
    systemView.add(labelAt(`⇄ ${j.dest_system}`, pos.clone().add(new THREE.Vector3(0,44,0)), '#d9b6ff'));
    if(j.hazards && j.hazards.length) systemView.add(hazardSprite(pos));
  });

  // CombatBot nav points carry authored coordinates and optional asteroid
  // fields. Keep the generated nav layout above, then overlay these points
  // using the CombatBot coordinate space (scaled into the system view).
  navs.filter(n=>n.source==='combatbot' && n.coordinates).forEach(n=>{
    const c=n.coordinates;
    const pos=new THREE.Vector3(c.x*0.008, c.z*0.008, c.y*0.008);
    if(n.kind==='jump_point'){
      const jump=new THREE.Mesh(new THREE.SphereGeometry(30,24,16),
        new THREE.MeshBasicMaterial({color:0x208cff, transparent:true, opacity:0.5}));
      jump.position.copy(pos); jump.userData=n; jump.userData.isJump=true; systemView.add(jump);
      jumpMeshes.push(jump);
      systemView.add(labelAt(`⇄ ${n.dest_system || n.name}`, pos.clone().add(new THREE.Vector3(0,44,0)), '#d9b6ff'));
      if(n.hazards && n.hazards.length) systemView.add(hazardSprite(pos));
      return;
    }
    // Authored bases used to be represented only by a wireframe cube. Use
    // the same artwork as generated bases so they remain visible and
    // recognizable in CombatBot-authored layouts as well.
    const baseMesh = n.kind === 'base'
      ? spriteAt(spriteKeyForNav(n), 74)
      : new THREE.Mesh(
          new THREE.BoxGeometry(30,30,30),
          new THREE.MeshBasicMaterial({color:0x39ff88, wireframe:true, transparent:true, opacity:0.9})
        );
    baseMesh.position.copy(pos); baseMesh.userData=n; systemView.add(baseMesh);
    systemView.add(labelAt(n.name, pos.clone().add(new THREE.Vector3(0,28,0)), '#63ff9b'));
    if(n.asteroids){
      const blob=new THREE.Mesh(
        new THREE.SphereGeometry(72,20,12),
        new THREE.MeshBasicMaterial({color:0xb0b0b0, transparent:true, opacity:0.2, depthWrite:false})
      );
      blob.position.copy(pos); blob.userData={asteroidField:true}; systemView.add(blob);
    }
  });

  systemView.add(new THREE.AmbientLight(0x6677aa, 0.9));

  // fly camera to the system
  flyTo(new THREE.Vector3(0, 320, 900), origin);

  showSystemPanel(s, navs);
}

function spriteKeyForNav(nav){
  const type=(nav.planet_type||'').toLowerCase();
  const baseType=(nav.base_type||'').toLowerCase();
  // Base records carry the useful classification in base_type. Prefer it
  // over the generic host planet type (e.g. Rocky), otherwise every base
  // incorrectly falls through to asteroid-base artwork.
  if(baseType==='pleasure' || type==='pleasure') return 'pleasure';
  if(baseType==='agricultural' || type.includes('agricultural')) return 'agricultural';
  if(baseType==='solar' || type.includes('solar')) return 'solar';
  if(type.includes('ammonia')) return 'amonium';
  if(baseType==='industrial' || baseType==='refinery' || type==='industrial') return 'refinery';
  if(type==='oceanic') return 'water';
  // Mining and pirate bases use the asteroid-base artwork. This also gives
  // other unclassified bases the same compact base visual.
  if(nav.kind==='base') return 'asteroidBase';
  return null;
}

function spriteAt(textureKey, size){
  const texture=spriteTextures[textureKey];
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({
    map:texture,
    transparent:true,
    depthWrite:false
  }));
  sprite.scale.set(SPRITE_ASPECTS[textureKey]*size, size, 1);
  return sprite;
}

function orbitRing(r){
  const g=new THREE.RingGeometry(r-1.2,r+1.2,96);
  const m=new THREE.MeshBasicMaterial({color:0x2a3f6b,side:THREE.DoubleSide,transparent:true,opacity:.5});
  const ring=new THREE.Mesh(g,m); ring.rotation.x=Math.PI/2; return ring;
}
function hazardSprite(pos){
  const spr=labelAt('⚠', pos.clone().add(new THREE.Vector3(34,20,0)), '#ff9f6b'); return spr;
}
function labelAt(text,pos,color){ const s=makeLabel(text,color||'#cfe3ff'); s.position.copy(pos);
  s.scale.multiplyScalar(0.5); return s; }

function exitToUniverse(){
  mode='universe'; modeLabel.textContent='Universe'; universeBtn.disabled=true;
  panel.style.display='none';
  if(systemView){ scene.remove(systemView); disposeGroup(systemView); systemView=null; }
  jumpMeshes = [];
  renderer.domElement.style.cursor='default';
  pointCloud.visible=true; edgeLines.visible=true;
  if(influenceGroup) influenceGroup.visible=true;
  if(systemLabelGroup) systemLabelGroup.visible=true;
  frameUniverse(true);
}

function showSystemPanel(s, navs){
  const sector=sectorsData.find(x=>x.name===s.sector);
  let html=`<h2>${s.name}</h2>`+
    `<div class="q">${s.sector} Sector · ${s.quadrant||'?'} Quadrant · ${s.faction||'unknown'}</div>`+
    `<div class="desc">${s.descriptor||''}</div>`+
    `<div class="desc"><b>Visible:</b> ${s.visible||''}</div>`;
  if(sector) html+=`<div class="desc"><b>Sector:</b> ${sector.visible||''}</div>`;
  navs.forEach(n=>{
    const isPlanetish = (n.kind==='planet'||n.kind==='base');
    const primary = n.base_name || n.name || n.planet_type || 'Nav Point';
    html+=`<div class="nav ${n.kind}"><span class="k">${n.kind.replace('_',' ')}</span> `+
          `<b>${primary}</b>`+
          (isPlanetish && n.code?` <span style="color:#6f83a6">[${n.code}]</span>`:'')+
          (n.dest_system?` → ${n.dest_sector}/${n.dest_system}`:'');
    (n.hazards||[]).forEach(h=>{
      html+=`<div class="haz ${h.severity>=5?'sev5':''}">⚠ ${h.hazard} (sev ${h.severity}) — ${h.note}</div>`;
    });
    html+=`</div>`;
  });
  panel.innerHTML=html; panel.style.display='block';
}

function disposeGroup(g){ g.traverse(o=>{ if(o.geometry)o.geometry.dispose();
  if(o.material){ if(o.material.map)o.material.map.dispose(); o.material.dispose(); } }); }

// ---------- camera fly ----------
function flyTo(pos,target){
  camAnim={ p0:camera.position.clone(), p1:pos.clone(),
            t0:controls.target.clone(), t1:target.clone(), start:performance.now(), dur:900 };
}
function updateCamAnim(){
  if(!camAnim) return;
  const k=Math.min((performance.now()-camAnim.start)/camAnim.dur,1);
  const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; // easeInOutQuad
  camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);
  controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);
  if(k>=1) camAnim=null;
}

function buildLegend(){
  const el=document.getElementById('legend');
  // Factions that actually have an influence cloud (sorted by system count desc).
  const factions = [...influenceByFaction.keys()];
  const counts = {};
  systemsData.forEach(s=>{ const f=(s.faction||'unknown').toLowerCase();
    counts[f]=(counts[f]||0)+1; });
  factions.sort((a,b)=>(counts[b]||0)-(counts[a]||0));

  const pretty = f => f.charAt(0).toUpperCase()+f.slice(1);
  el.innerHTML =
    '<div style="color:#9fb6dd;margin-bottom:4px">Factions '+
    '<span style="color:#6f83a6;font-size:10px">(dbl-click to toggle influence)</span></div>'+
    factions.map(f=>{
      const mesh=influenceByFaction.get(f);
      const on = mesh ? mesh.visible : false;
      const hex = factionColor(f).toString(16).padStart(6,'0');
      return `<div class="row leg-row" data-faction="${f}" `+
             `style="cursor:pointer;opacity:${on?1:0.4};user-select:none">`+
             `<span class="dot" style="background:#${hex}"></span>`+
             `${pretty(f)} <span style="color:#6f83a6;font-size:10px">(${counts[f]||0})</span></div>`;
    }).join('')+
    '<div style="color:#9fb6dd;margin:6px 0 4px">size = hazard count</div>';

  el.querySelectorAll('.leg-row').forEach(row=>{
    row.addEventListener('dblclick', ()=>{
      const f=row.getAttribute('faction') || row.dataset.faction;
      const mesh=influenceByFaction.get(f);
      if(!mesh) return;
      mesh.visible = !mesh.visible;
      row.style.opacity = mesh.visible ? 1 : 0.4;
    });
  });
}
function buildSystemList(){
  const dl=document.getElementById('systemList');
  dl.innerHTML=systemsData.map(s=>`<option value="${s.name}">`).join('');
}

function updateLabelFacing(){ /* sprites always face camera automatically */ }

function animate(){
  requestAnimationFrame(animate);
  updateCamAnim();
  controls.update();
  updateSystemLabels();
  renderer.render(scene,camera);
}
</script>
