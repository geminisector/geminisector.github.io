<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Mineral-rich asteroid</title>
  <desc id="desc">A dark asteroid with glowing cyan and amber mineral veins against a starfield.</desc>

  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#101a33"/>
      <stop offset="55%" stop-color="#070b18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <linearGradient id="rock" x1="18%" y1="4%" x2="82%" y2="96%">
      <stop offset="0%" stop-color="#778397"/>
      <stop offset="28%" stop-color="#4d586b"/>
      <stop offset="60%" stop-color="#293244"/>
      <stop offset="100%" stop-color="#111725"/>
    </linearGradient>

    <linearGradient id="vein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ffff"/>
      <stop offset="35%" stop-color="#39f4ff"/>
      <stop offset="70%" stop-color="#00a6d6"/>
      <stop offset="100%" stop-color="#ffb938"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00eaff" stop-opacity=".38"/>
      <stop offset="55%" stop-color="#006f9c" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="400" height="200" fill="url(#space)"/>

  <g fill="#dff8ff">
    <circle cx="34" cy="28" r="1.1" opacity=".7"/>
    <circle cx="72" cy="58" r=".8" opacity=".5"/>
    <circle cx="96" cy="20" r="1.4" opacity=".8"/>
    <circle cx="132" cy="76" r=".7" opacity=".45"/>
    <circle cx="168" cy="24" r=".9" opacity=".6"/>
    <circle cx="206" cy="52" r=".7" opacity=".5"/>
    <circle cx="258" cy="18" r="1.2" opacity=".75"/>
    <circle cx="302" cy="48" r=".8" opacity=".55"/>
    <circle cx="344" cy="26" r="1.3" opacity=".8"/>
    <circle cx="370" cy="74" r=".7" opacity=".5"/>
    <circle cx="318" cy="152" r="1" opacity=".65"/>
    <circle cx="274" cy="178" r=".7" opacity=".45"/>
    <circle cx="40" cy="166" r="1.2" opacity=".7"/>
    <circle cx="18" cy="108" r=".8" opacity=".5"/>
    <circle cx="376" cy="128" r=".9" opacity=".55"/>
  </g>

  <ellipse cx="208" cy="103" rx="132" ry="94" fill="url(#halo)"/>

  <g transform="translate(2 0)">
    <path d="M151 36 L213 21 L268 39 L310 72 L319 118 L297 157 L246 176 L182 170 L143 144 L126 104 L131 65 Z"
          fill="url(#rock)" stroke="#8a98ad" stroke-opacity=".42" stroke-width="1.2"/>

    <path d="M151 36 L213 21 L268 39 L310 72 L308 89 L260 72 L208 62 L160 82 L131 65 Z"
          fill="#aeb9c9" opacity=".17"/>
    <path d="M143 144 L182 170 L246 176 L297 157 L278 139 L226 146 L183 132 L155 118 Z"
          fill="#02050b" opacity=".46"/>
    <path d="M126 104 L143 144 L183 132 L175 96 L193 70 L160 82 Z"
          fill="#050913" opacity=".32"/>

    <g fill="#111827" stroke="#8b98ac" stroke-opacity=".22" stroke-width=".7">
      <ellipse cx="189" cy="53" rx="17" ry="10" transform="rotate(-14 189 53)"/>
      <ellipse cx="239" cy="100" rx="25" ry="15" transform="rotate(18 239 100)"/>
      <ellipse cx="175" cy="119" rx="13" ry="8" transform="rotate(-8 175 119)"/>
      <ellipse cx="273" cy="73" rx="10" ry="6" transform="rotate(-24 273 73)"/>
      <ellipse cx="206" cy="148" rx="9" ry="5" transform="rotate(12 206 148)"/>
      <ellipse cx="257" cy="139" rx="7" ry="4" transform="rotate(22 257 139)"/>
      <ellipse cx="151" cy="80" rx="7" ry="4" transform="rotate(-18 151 80)"/>
    </g>

    <g fill="#060b15" opacity=".38">
      <path d="M163 51 q22 -9 43 2 q-19 7 -43 -2 Z"/>
      <path d="M218 94 q22 -8 42 3 q-18 10 -42 -3 Z"/>
      <path d="M165 115 q9 -3 17 2 q-8 5 -17 -2 Z"/>
    </g>

    <g fill="none" stroke="url(#vein)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M159 70 L171 84 L166 98 L180 110 L173 124" stroke-width="3.1" opacity=".95"/>
      <path d="M214 62 L225 77 L219 90 L238 101 L231 117 L242 130" stroke-width="2.5" opacity=".9"/>
      <path d="M262 57 L270 71 L264 83" stroke-width="2.2" opacity=".85"/>
      <path d="M281 109 L292 120 L286 135" stroke-width="1.8" opacity=".8"/>
    </g>

    <g fill="none" stroke="#d8ffff" stroke-linecap="round" stroke-linejoin="round" opacity=".65">
      <path d="M159 70 L171 84 L166 98 L180 110 L173 124" stroke-width="1"/>
      <path d="M214 62 L225 77 L219 90 L238 101 L231 117 L242 130" stroke-width=".9"/>
    </g>

    <g fill="#9bfbff" filter="url(#soft-glow)" opacity=".9">
      <polygon points="152,66 158,58 166,68 160,76"/>
      <polygon points="228,89 236,82 242,94 232,101"/>
      <polygon points="286,131 293,124 299,136 290,142"/>
    </g>

    <g fill="#ffc65c" opacity=".8">
      <polygon points="205,68 209,63 213,70 208,74"/>
      <polygon points="246,121 251,115 255,123 249,128"/>
      <polygon points="177,140 181,135 185,142 180,146"/>
    </g>
  </g>

  <g fill="#7b8799" opacity=".75">
    <path d="M325 112 l9 -5 7 7 -6 10 -10 -3 Z"/>
    <path d="M104 62 l6 -3 5 5 -4 7 -7 -2 Z"/>
    <path d="M333 84 l4 -2 3 4 -3 5 -5 -2 Z"/>
  </g>
</svg>
